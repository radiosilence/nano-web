name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GitHub evicts a cache after 7 days without a read, and this repo goes quiet
  # for longer than that. A run restores every cache, and a restore is a read,
  # so a tick twice a week keeps main warm through the gaps. Nothing here
  # publishes on a schedule — those jobs all gate on a push event.
  schedule:
    - cron: "0 6 * * 1,4"
  # Releases whatever version is not yet released: how a failed release is
  # retried.
  workflow_dispatch:

# A pull request's newer push cancels its older run. Runs on main are never
# cancelled, since any of them may be publishing a release, and a manual run
# is in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # A pull request restores main's cache but writes none of its own: a
          # branch's cache is invisible to every other branch and still evicts
          # from the repository's 10GB, which is how main ends up cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # One job, one target directory: clippy compiles the dependency graph and
      # the tests reuse it, where two jobs each built it into a cache of its own.
      # fmt compiles nothing, so it goes first and fails cheapest.
      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, as a
  # release does, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # Runs on pull requests too, since build-image and apple read its outputs;
  # only a push or manual run on main can release.
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      major: ${{ steps.check.outputs.major }}
      major_minor: ${{ steps.check.outputs.major_minor }}
      apple: ${{ steps.apple.outputs.apple }}
      release_pr: ${{ steps.apple.outputs.release_pr }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      # A push releases only when it changes the version. Comparing with the
      # latest GitHub release alone would let a push that lands while a release
      # is still running release the same version a second time. A manual run
      # releases whatever is unreleased.
      - name: Check if release needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          CURRENT_VERSION=$(version_of < Cargo.toml)
          PREVIOUS_VERSION=$(git show HEAD^:Cargo.toml 2>/dev/null | version_of || true)
          LATEST_RELEASE=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          LATEST_VERSION=${LATEST_RELEASE#v}
          if [ "$REF" != "refs/heads/main" ] || { [ "$EVENT" != "push" ] && [ "$EVENT" != "workflow_dispatch" ]; }; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      # nano-web has no Apple-only code, so Linux checks almost everything a
      # pull request can break on macOS. What it cannot check is a change to
      # the dependencies, the toolchain, the build configuration or the
      # workflow, or Rust code gated on an Apple target; only those pull
      # requests take a macOS runner. A release pull request is one that
      # changes the version in Cargo.toml, so it always does, and it also
      # builds the release binary.
      - name: Check if the change needs macOS
        id: apple
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          apple=false
          release_pr=false
          if [ "$EVENT" = "pull_request" ]; then
            if [ "$(git show HEAD^1:Cargo.toml | version_of)" != "$(version_of < Cargo.toml)" ]; then
              release_pr=true
            fi
            if git diff --name-only HEAD^1 HEAD | grep -qE '^(Cargo\.(toml|lock)|build\.rs|rust-toolchain(\.toml)?|\.mise\.toml|\.cargo/|\.github/workflows/)' \
              || git diff HEAD^1 HEAD -- '*.rs' | grep -qE '^[+-].*target_(os|vendor) *= *"(macos|apple)"'; then
              apple=true
            fi
          fi
          echo "apple=$apple" >> "$GITHUB_OUTPUT"
          echo "release_pr=$release_pr" >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # A cancelled leg saves nothing, so one broken target would leave the rest
      # of the matrix cold on the next run as well as this one.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: nano-web-linux-amd64-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: nano-web-linux-arm64-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: nano-web-windows-amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/nano-web.exe ${{ matrix.name }}
          else
            cp target/${{ matrix.target }}/release/nano-web ${{ matrix.name }}
          fi

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  # Every macOS step in one job on one runner, sharing one target directory
  # and one cache: the account has few macOS runners and every repository
  # queues for them. A pull request that needs macOS runs clippy and the
  # tests, which compile all the code the release build does; a release pull
  # request also builds the release binary, unsigned, so a broken release
  # build fails before the version merges. A release builds, notarises and
  # uploads the binary its pull request already checked. Anything else skips
  # the job, which then holds no runner.
  #
  # Only the scheduled run saves the cache, and it runs the checks alone, so
  # the cache holds the profile pull requests build. A release run saving it
  # would leave an entry with only release artifacts under the same key, and
  # later runs would restore that instead. Release builds start cold.
  apple:
    name: Apple
    runs-on: macos-latest
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true' || needs.check-version.outputs.apple == 'true' || github.event_name == 'schedule'
    env:
      CHECK: ${{ needs.check-version.outputs.should_release != 'true' }}
      PACKAGE: ${{ needs.check-version.outputs.should_release == 'true' || needs.check-version.outputs.release_pr == 'true' }}
      RELEASE: ${{ needs.check-version.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: aarch64-apple-darwin
          save-if: ${{ github.event_name == 'schedule' }}

      # Each check runs whether or not the one before it passed, so a clippy failure
      # does not hide whether the tests pass.
      - name: Clippy
        if: ${{ !cancelled() && env.CHECK == 'true' }}
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test
        if: ${{ !cancelled() && env.CHECK == 'true' }}
        run: cargo test --all-features --locked

      - name: Build binary
        if: ${{ !cancelled() && env.PACKAGE == 'true' }}
        run: cargo build --release --locked

      # Developer ID signed and notarised, so the binary runs from a browser
      # download without clearing quarantine.
      - name: Sign and notarise
        if: env.RELEASE == 'true'
        uses: radiosilence/blit-workflows/macos-notarise@c8a650dfa5a0fbe012c61eab28f615c1983aee18
        with:
          binaries: |
            target/release/nano-web
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          api-key-p8: ${{ secrets.APPLE_API_KEY_P8 }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Prepare binary
        if: env.RELEASE == 'true'
        run: cp target/release/nano-web nano-web-macos-arm64

      - name: Upload binary
        if: env.RELEASE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nano-web-macos-arm64
          path: nano-web-macos-arm64

  # Compiles the musl binary and ships it straight into the image on the same
  # runner. Kept out of build-binaries so the image never waits on the Windows
  # leg; kept in one job so the binary never round-trips through the
  # artifact store, which would cost a runner handoff and drop its exec bit.
  # Runs on PRs too — only the registry push is gated, via PUBLISH, to a push
  # or manual run on main.
  build-image:
    name: Build ${{ matrix.arch }} Image
    runs-on: ${{ matrix.runner }}
    needs: [check-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Same file feeds the image build and the release asset.
      - name: Prepare binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/nano-web \
            dist/nano-web-linux-${{ matrix.arch }}-musl

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nano-web-linux-${{ matrix.arch }}-musl
          path: dist/nano-web-linux-${{ matrix.arch }}-musl

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Log in to Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On PRs this still builds — it just discards the result instead of
      # pushing, so a broken Dockerfile fails before merge rather than after.
      - name: Build ${{ matrix.arch }}
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ matrix.arch }}

      - name: Tag ${{ matrix.arch }} with version
        if: env.PUBLISH == 'true' && needs.check-version.outputs.should_release == 'true'
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.check-version.outputs.version }}-${{ matrix.arch }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${{ matrix.arch }}

  create-manifest:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [check, changelog, build-image, check-version]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push main manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-arm64

      - name: Push release manifests
        if: needs.check-version.outputs.should_release == 'true'
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          MAJOR="${{ needs.check-version.outputs.major }}"
          MAJOR_MINOR="${{ needs.check-version.outputs.major_minor }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)

          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64

          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64

          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MAJOR_MINOR} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64

          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MAJOR} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64

          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-arm64

      - name: Show built images
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)

          echo "🐳 **Built Docker Images:**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: \`${VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Before the GitHub release: a version on crates.io cannot be taken back, so
  # it goes out only once every check and build has passed. Publishing errors
  # on a version already out, so a re-run checks the index first.
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [check, changelog, build-binaries, apple, check-version, create-manifest]
    if: needs.check-version.outputs.should_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          if curl -sf https://index.crates.io/na/no/nano-web | grep -q "\"vers\":\"${VERSION}\""; then
            echo "nano-web ${VERSION} is already on crates.io"
            exit 0
          fi
          cargo publish --locked

  # The action creates the tag through the API, on the commit that was built:
  # GitHub refuses a git push of it from the workflow token for any commit that
  # changes a workflow. The notes are the version's section of CHANGELOG.md. A
  # re-run finds the release and tag and fills in what is missing.
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, publish-crate]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Release notes
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          body_path: notes.md
          files: |
            nano-web-linux-amd64-gnu/nano-web-linux-amd64-gnu
            nano-web-linux-arm64-gnu/nano-web-linux-arm64-gnu
            nano-web-linux-amd64-musl/nano-web-linux-amd64-musl
            nano-web-linux-arm64-musl/nano-web-linux-arm64-musl
            nano-web-macos-arm64/nano-web-macos-arm64
            nano-web-windows-amd64.exe/nano-web-windows-amd64.exe
